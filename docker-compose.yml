name: ceolx

services:
  postgres:
    image: postgres:16-alpine
    container_name: ceolx_postgres
    environment:
      POSTGRES_USER: ceolx
      POSTGRES_PASSWORD: ceolx_local
      POSTGRES_DB: ceolx_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceolx -d ceolx_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: ceolx_mailpit
    ports:
      - "1025:1025" # SMTP — nodemailer target in local dev
      - "8025:8025" # Web UI — http://localhost:8025
    restart: unless-stopped

  typesense:
    image: typesense/typesense:29.0
    container_name: ceolx_typesense
    command: --data-dir /data --api-key=dev-local-key --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  typesense_data:
